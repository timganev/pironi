name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java 25 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Clean build and tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Executable JAR smoke test
        run: java -jar target/pironi-0.1.0-SNAPSHOT.jar --help
      - name: Interactive terminal regression
        if: runner.os == 'Linux'
        run: java -jar target/pironi-0.1.0-SNAPSHOT.jar --test-keys
